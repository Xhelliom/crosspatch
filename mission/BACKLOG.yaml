items:
- id: IMP-001
  direction_id: DIR-001
  title: Ajouter une étape de vérification des cas limites
  evidence: Les échecs répétés sur des cas spécifiques de roundtrip de chiffres.
  hypothesis: Si l'agent vérifie explicitement les cas limites avant de rendre sa
    réponse, alors le `pass_rate` devrait augmenter de 0.05.
  goal: A
  expected_gain: 0.05
  confidence: 0.7
  cost: 1.5
  risk: low
  state: submitted
  author: A
  born_gen: null
- id: IMP-002
  direction_id: DIR-002
  title: Optimiser la gestion des tokens pour réduire les coûts
  evidence: Le nombre élevé de tokens utilisés par tâche (749.0).
  hypothesis: Si l'agent utilise une méthode de compression de contexte, alors `tokens_per_task`
    devrait diminuer de 10% sans affecter le `pass_rate`.
  goal: A
  expected_gain: 0.1
  confidence: 0.6
  cost: 1.0
  risk: medium
  state: submitted
  author: A
  born_gen: null
- id: IMP-003
  direction_id: DIR-003
  title: Structurer les messages entre agents
  evidence: La communication entre agents est actuellement en texte libre.
  hypothesis: Si les messages entre agents sont structurés en JSON, alors l'`acceptance_rate`
    devrait augmenter de 0.05.
  goal: A
  expected_gain: 0.05
  confidence: 0.5
  cost: 2.0
  risk: high
  state: submitted
  author: A
  born_gen: null
- id: IMP-004
  direction_id: DIR-001
  title: Implémenter un mécanisme de retry avec feedback
  evidence: Les échecs montrent des erreurs répétitives qui pourraient être corrigées
    avec un mécanisme de retry basé sur le feedback des tests.
  hypothesis: Si l'agent implémente un mécanisme de retry avec feedback des tests,
    alors le `pass_rate` devrait augmenter de 0.07.
  goal: A
  expected_gain: 0.07
  confidence: 0.6
  cost: 1.5
  risk: medium
  state: submitted
  author: B
  born_gen: null
