[pytest]
# `pythonpath = .` : sans ça, `pytest` (le script) ne met pas la racine du
# dépôt sur sys.path et aucun `from kernel…` ne résout. `python -m pytest`
# le fait implicitement — d'où une suite qui passe en local et casse en CI.
pythonpath = .

# `testpaths = tests` : `harness/tasks/*/test_solution.py` ne sont pas des
# tests de ce dépôt. Ce sont les tests de référence exécutés **en sandbox**
# contre le `solution.py` que l'agent vient d'écrire ; hors sandbox il n'y a
# pas de module `solution` et la collecte échoue. Ils sont immuables : c'est
# ici qu'on les met hors du chemin, pas en les touchant.
testpaths = tests

norecursedirs = .git .venv workspaces candidates data harness
addopts = -q
