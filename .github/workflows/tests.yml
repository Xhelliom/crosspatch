# `.github/` est dans guard.PROTECTED : aucun agent ne peut toucher à ce
# fichier. C'est voulu — le portail de vérification ne doit pas être
# modifiable par ce qu'il vérifie.
name: tests

on:
  push:
    branches: [main, "evolution/**", "claude/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # L'archive a deux backends et le SQL est traduit d'un dialecte à
    # l'autre : la suite doit passer sur les deux, sinon la traduction n'est
    # vérifiée que le jour où le cluster est en route.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crosspatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Aucun `secrets:` dans ce job, et c'est la propriété qu'on veut :
      # la suite ne fait aucun appel réseau. Le jour où un test réclame une
      # clé, c'est qu'il est devenu un test d'intégration et qu'il a sa
      # place ailleurs.
      - name: Suite de tests (SQLite + Postgres)
        env:
          CROSSPATCH_TEST_PG: postgresql://postgres:postgres@localhost:5432/crosspatch
        run: pytest -q
