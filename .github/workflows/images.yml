# Construit et publie l'image sur GHCR.
#
# `.github/` est dans guard.PROTECTED : aucun agent ne peut toucher à ce
# fichier. C'est la chaîne qui transforme un « oui » humain en code
# redéployé, elle ne doit pas être modifiable par ce qu'elle déploie.
name: images

on:
  push:
    # `evolution/**` n'est pas décoratif : c'est la branche que le worker
    # pousse après validation humaine. Sans build ici, le « redéploiement
    # recharge le code » de l'invariant n°1 n'a rien à recharger.
    branches: [main, "evolution/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Aucune image n'est publiée sans que la suite soit passée, sur les deux
  # backends d'archive et les deux versions de Postgres.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `promote()` fait un commit puis un push depuis /app : l'image
          # doit embarquer un dépôt git complet. Un clone superficiel ne
          # peut pas repousser.
          fetch-depth: 0
          # Et surtout : sans ça, checkout écrit le jeton du run dans
          # .git/config (http.extraheader). Comme .dockerignore conserve
          # .git volontairement, ce jeton finirait dans une couche de
          # l'image publiée.
          persist-credentials: false

      - name: Vérifier qu'aucun identifiant n'est embarqué
        run: |
          if grep -riE 'extraheader|AUTHORIZATION|ghp_|github_pat_' .git/config; then
            echo "::error::identifiant présent dans .git/config — build interrompu"
            exit 1
          fi
          echo "OK : .git/config ne contient aucun identifiant"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action met le nom en minuscules : GHCR les exige, et le
          # propriétaire du dépôt porte une majuscule.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 seul : ajouter linux/arm64 ici si le cluster tourne
          # sur des cartes ARM. Ça double le temps de build.
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rappeler l'image publiée
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
