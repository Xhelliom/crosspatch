# Postgres en local aussi, pas SQLite : le cluster tourne sur Postgres, et
# une divergence local/production est exactement la classe de bug que ce
# projet ne peut pas se permettre. SQLite reste le défaut du code — c'est ce
# qui fait tourner la suite de tests sans dépendance.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: crosspatch
      POSTGRES_USER: crosspatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crosspatch-local}
      # Postgres 18 range ses données par version majeure et ignorerait un
      # mount sur .../data sans PGDATA explicite. Même valeur que
      # `deploy/k8s/postgres.yaml` : la divergence local/cluster est
      # exactement ce qu'on ne veut pas.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: ["./data/pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosspatch -d crosspatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["${CROSSPATCH_PORT:-8480}:8080"]
    env_file: .env
    environment:
      CROSSPATCH_ARCHIVE: postgresql://crosspatch:${POSTGRES_PASSWORD:-crosspatch-local}@db:5432/crosspatch
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    command: python -m orchestrator.loop
    env_file: .env
    environment:
      CROSSPATCH_ARCHIVE: postgresql://crosspatch:${POSTGRES_PASSWORD:-crosspatch-local}@db:5432/crosspatch
    # Volumes nommés, pas des bind mounts : l'image tourne en uid 10001 et
    # un bind créé par Docker appartient à root. C'est aussi l'équivalent
    # local du PVC `worker-state` — un bind vers le dépôt en divergerait.
    volumes:
      - workspaces:/app/workspaces
      - candidates:/app/candidates
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }

volumes:
  workspaces:
  candidates:
