# GABARIT — ne jamais remplir ce fichier et le committer.
#
# Crée le Secret en ligne de commande, il ne passera pas par git :
#
#   kubectl -n crosspatch create secret generic crosspatch-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=CONTROL_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=OPENROUTER_API_KEY='sk-or-…' \
#     --from-literal=AGENT_OPENROUTER_API_KEY='sk-or-…' \
#     --from-literal=E2B_API_KEY='e2b_…' \
#     --from-literal=GIT_PUSH_TOKEN='github_pat_…'
#
# AGENT_OPENROUTER_API_KEY doit être **distincte** d'OPENROUTER_API_KEY et
# plafonnée bas : elle est injectée dans une VM qui exécute du code écrit
# par un modèle.
apiVersion: v1
kind: Secret
metadata:
  name: crosspatch-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "à-générer"
  CONTROL_TOKEN: "à-générer"
  OPENROUTER_API_KEY: "sk-or-..."
  AGENT_OPENROUTER_API_KEY: "sk-or-..."
  E2B_API_KEY: "e2b_..."
  GIT_PUSH_TOKEN: ""
